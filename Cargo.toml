[workspace]
resolver = "3"
members = [
    "crates/*",
    "coruma",
    "derputils",
    "lny",
    "rpgdemake",
    "imgo",
    "./noah",
    "./noah/crates/*",
]

[workspace.package]
authors = [ "MidAutumnMoon" ]
license = "GPL-3.0-or-later"
repository = "https://github.com/MidAutumnMoon/InOri"
edition = "2024"
rust-version = "1.95.0"
version = "4.4.2"
homepage = "https://github.com/nix-community/nh"

#
# Dependencies
#

[workspace.dependencies]
# InOri internal crates
ino_color = { path = "./crates/ino_color" }
ino_tracing = { path = "./crates/ino_tracing" }
ino_path = { path = "./crates/ino_path" }
ino_tap = { path = "./crates/ino_tap" }

# Shared dependencies (InOri + Noah)
anyhow = "1"
assert_fs = "1"
clap = { version = "4", features = [ "cargo", "color", "derive", "env", "unstable-styles" ] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
indicatif = "0.18"
itertools = "0"
rayon = "1"
rootcause = "0"
rustix = { version = "1", features = [ "all-apis" ] }
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
strum = { version = "0", features = ["derive"] }
tap = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [ "env-filter", "registry", "std" ] }

#
# Profiles
#

[profile.release]
lto = "thin"
strip = "debuginfo"

[profile.perf]
inherits = "release"
debug = true
strip = false

#
# Lints
#

[workspace.lints.clippy]
all = { priority = -1, level = "warn" }
pedantic = { priority = -1, level = "warn" }
nursery = { priority = -1, level = "warn" }

cognitive_complexity = "allow"
literal_string_with_formatting_args = "allow"
missing_const_for_fn = "allow"
too_many_lines = "allow"

# Noah allows
struct_excessive_bools = "allow"

unwrap_used = "warn"
panic = "warn"
indexing_slicing = "warn"
unreachable = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_in_result = "warn"
expect_used = "warn"
todo = "warn"
unimplemented = "warn"
