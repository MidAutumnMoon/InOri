[package]
name                   = "nh"
license = "EUPL-1.2"
repository             = "https://github.com/nix-community/nh"
description            = "Yet Another Nix Helper"
keywords               = [ "nix", "nixos", "nix-darwin", "helper", "CLI" ]
readme                 = "../../docs/README.md"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
default-run            = "nh"

[dependencies]
anstyle.workspace             = true
clap.workspace                = true
clap-verbosity-flag.workspace = true
color-eyre.workspace          = true
nh-clean = { path = "../nh-clean" }
nh-core = { path = "../nh-core" }
nh-nixos = { path = "../nh-nixos" }
nh-search = { path = "../nh-search" }
tracing.workspace             = true
tracing-subscriber.workspace  = true
yansi.workspace               = true

[dev-dependencies]
serial_test.workspace = true

[lints]
workspace = true
